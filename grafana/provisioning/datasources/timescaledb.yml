apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb-elevator
    type: postgres
    # Lokal:  GF_POSTGRES_HOST=timescaledb (Docker-Service-Name)
    # Azure:  GF_POSTGRES_HOST=<server>.postgres.database.azure.com
    url: ${GF_POSTGRES_HOST}:5432
    user: ${GF_POSTGRES_USER}
    jsonData:
      database: ${GF_POSTGRES_DB}
      sslmode: ${GF_POSTGRES_SSLMODE}
      maxOpenConns: 10
      maxIdleConns: 2
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GF_POSTGRES_PASSWORD}
    isDefault: true
    editable: true
