# ============================================================
# Elevator Poller – Config-driven Ingest
# ============================================================
# Neue Endpunkte werden hier ergänzt – kein Code-Change nötig.
# Umgebungsvariablen werden als ${VAR_NAME} aus der .env geladen.
#
# Elevision-Endpunkt pro Controller:
#   GET /publicapi/controllers/{id}
#   → liftStatus.car.floor  = aktuelles Stockwerk
#   → liftStatus.car.driveState = REST | DRIVE | LANDING | …
# ============================================================

sources:

  # ID 242600 – Campus Brücken HN West beim L Bau (verbunden)
  # elevator_name_override: API-Name weicht vom DB-Namen ab → fixer Override
  - name: "Campus Brücken HN West beim L Bau"
    url: "${ELEVISION_API_BASE}/publicapi/controllers/242600"
    api_key: "${ELEVISION_JWT_TOKEN}"
    poll_interval_sec: 60
    timeout_sec: 10
    rate_limit_rps: 1.0
    field_mapping:
      elevator_name: "name"
      elevator_name_override: "Campus Brücken HN West"
      floor: "liftStatus.car.floor"

  # ID 242601 – Campus Brücken HN Ost (verbunden)
  - name: "Campus Brücken HN Ost"
    url: "${ELEVISION_API_BASE}/publicapi/controllers/242601"
    api_key: "${ELEVISION_JWT_TOKEN}"
    poll_interval_sec: 60
    timeout_sec: 10
    rate_limit_rps: 1.0
    field_mapping:
      elevator_name: "name"
      floor: "liftStatus.car.floor"

  # ID 269916 – Teststand lipah Aufzüge Heilbronn (verbunden)
  - name: "Teststand lipah Aufzüge Heilbronn"
    url: "${ELEVISION_API_BASE}/publicapi/controllers/269916"
    api_key: "${ELEVISION_JWT_TOKEN}"
    poll_interval_sec: 60
    timeout_sec: 10
    rate_limit_rps: 1.0
    field_mapping:
      elevator_name: "name"
      floor: "liftStatus.car.floor"

